<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shift+Tab</title>
  </head>
  <body>
    <button id="previous">Previous</button>
    <button id="current">Current</button>
    <output id="keyboard-events">[]</output>
    <script>
      const events = [];
      const output = document.querySelector("#keyboard-events");

      for (const type of ["keydown", "keyup"]) {
        document.addEventListener(
          type,
          (event) => {
            events.push({
              type: event.type,
              key: event.key,
              code: event.code,
              shiftKey: event.shiftKey,
              altKey: event.altKey,
              ctrlKey: event.ctrlKey,
              metaKey: event.metaKey,
              trusted: event.isTrusted,
            });
            output.textContent = JSON.stringify(events);
          },
          true,
        );
      }

      document.querySelector("#current").focus();
    </script>
  </body>
</html>
